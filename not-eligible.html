  .card{
    background:#fff;border-radius:16px;max-width:560px;width:100%;
    padding:44px 34px 40px;text-align:center;
    box-shadow:0 10px 32px rgba(13,37,66,.12);
  }
  .card-icon{
    width:76px;height:76px;border-radius:50%;background:var(--navy-mid);
    display:flex;align-items:center;justify-content:center;margin:0 auto 20px;
  }
  .card-icon svg{width:38px;height:38px;}
  h1{font-weight:900;font-size:clamp(26px,6vw,32px);letter-spacing:-.3px;line-height:1.15;margin-bottom:14px;}
  .card p{
    color:#44546a;font-size:clamp(16px,4.4vw,18px);font-weight:500;line-height:1.6;
  }
  .site-footer{background:var(--navy);color:#fff;padding:26px 20px 30px;text-align:center;}
  .f-links{display:flex;flex-wrap:wrap;gap:8px 22px;align-items:center;justify-content:center;font-size:14px;font-weight:700;}
  .f-links a{color:#fff;display:inline-block;padding:8px 2px;text-decoration:none;}
  .f-links a:hover{text-decoration:underline;}
  .f-note{color:#aab8c9;font-size:12px;margin-top:12px;}
